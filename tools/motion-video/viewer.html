<!doctype html>
<!--
  m2mr run viewer, served by tools/motion-video/view.mjs.

  Left: the gesture video we rendered and fed to m2mr. Right: the GLB m2mr
  wrote (the rig's mesh playing `mixamo_clip`), orbitable. One timeline drives
  both, so a frame on the left and the pose on the right are the same instant.
-->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>m2mr viewer</title>
<style>
  :root { color-scheme: dark; --bg: #15171b; --panel: #1e2127; --line: #2c3038; --fg: #e6e8ec; --dim: #9aa1ad; --acc: #6aa8ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
  header { display: flex; gap: 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  select, button { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  button.on { border-color: var(--acc); color: var(--acc); }
  .meta { color: var(--dim); font-size: 12px; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 0; }
  main.single { grid-template-columns: 1fr; }
  .pane { position: relative; background: #000; min-height: 0; display: flex; }
  .pane > video, .pane > canvas { width: 100%; height: 100%; object-fit: contain; display: block; }
  .tag { position: absolute; top: 8px; left: 10px; padding: 3px 8px; background: #000a; border-radius: 4px; font-size: 12px; pointer-events: none; }
  footer { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); }
  input[type=range] { flex: 1; accent-color: var(--acc); }
  .time { font-variant-numeric: tabular-nums; color: var(--dim); min-width: 110px; text-align: right; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<header>
  <h1>m2mr viewer</h1>
  <select id="run"></select>
  <button id="cmp">Show m2mr compare video</button>
  <span class="meta" id="meta"></span>
  <a href="/concepts" style="margin-left:auto;color:var(--dim);text-decoration:none">Concept Review →</a>
</header>
<main id="main">
  <div class="pane" id="left"><video id="src" muted playsinline preload="auto"></video><span class="tag" id="ltag">Input: generated gesture video</span></div>
  <div class="pane" id="right"><span class="tag" id="rtag">Output: mixamo_character.glb (drag to orbit)</span></div>
</main>
<footer>
  <button id="play">Pause</button>
  <select id="speed"><option>0.25</option><option>0.5</option><option selected>1</option></select>
  <button id="loop" class="on">Loop</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
  <span class="time" id="time">0.00 / 0.00 s</span>
</footer>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
const video = $("src");
let paused = false;

// ---- 3D pane ---------------------------------------------------------------
const right = $("right");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
right.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#2a2e35");
scene.add(new THREE.HemisphereLight(0xffffff, 0x444a55, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 1.8);
sun.position.set(2, 4, 3);
scene.add(sun);
const grid = new THREE.GridHelper(10, 20, 0x556070, 0x3a404a);
scene.add(grid);
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 100);
camera.position.set(0.6, 1.2, 4.2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.95, 0);
controls.update();

let model = null, mixer = null, action = null, clipDur = 0;
// A finished game clip starts where it was cut from the source video, and a
// loop repeats; run.json says so (clip_offset_s, clip_loop) and the pose follows.
let clipOffset = 0, clipLoop = false;

function resize() {
  const r = right.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(right);

// ---- runs ------------------------------------------------------------------
const runs = await (await fetch("/runs.json")).json();
for (const r of runs) $("run").append(new Option(r, r));
$("run").onchange = () => load($("run").value);
if (runs.length) await load(runs[0]);
else $("meta").textContent = "No runs found.";

async function load(name) {
  const base = `/runs/${encodeURIComponent(name)}/`;
  showCompare(false);
  video.src = base + "source.mp4";
  if (model) scene.remove(model);
  const loader = new GLTFLoader();
  const gltf = await loader.loadAsync(base + "mixamo_character.glb");
  // m2mr's GLB carries the motion but no UVs/textures. When the run has the
  // converter's textured twin (character.glb: same mixamorig bones, same
  // identity rest frames), show that and play m2mr's clip on it by bone name.
  // Only translations differ in unit (cm vs m), so position tracks are rescaled
  // by the ratio of the two rest hip heights.
  let textured = null;
  try { textured = await loader.loadAsync(base + "character.glb"); } catch {}
  if (textured) {
    const hipsY = (root) => { let y = null; root.traverse((o) => { if (o.isBone && /Hips$/.test(o.name)) y ??= o.position.y; }); return y; };
    const k = hipsY(textured.scene) / hipsY(gltf.scene);
    gltf.animations = gltf.animations.map((clip) => {
      const c = clip.clone();
      for (const t of c.tracks) if (t.name.endsWith(".position")) for (let i = 0; i < t.values.length; i++) t.values[i] *= k;
      return c;
    });
    gltf.scene = textured.scene;
  }
  model = gltf.scene;
  // Normalise to 1.8 m, centred, feet on the grid.
  const box = new THREE.Box3().setFromObject(model);
  model.scale.multiplyScalar(1.8 / (box.max.y - box.min.y));
  const fit = new THREE.Box3().setFromObject(model);
  const mid = fit.getCenter(new THREE.Vector3());
  model.position.set(-mid.x, -fit.min.y, -mid.z);
  scene.add(model);
  mixer = new THREE.AnimationMixer(model);
  const clip = gltf.animations[0];
  action = clip ? mixer.clipAction(clip).play() : null;
  clipDur = clip?.duration ?? 0;
  clipOffset = 0; clipLoop = false;
  let meta = `${gltf.animations.map((a) => `${a.name} ${a.duration.toFixed(2)} s`).join(", ") || "no clip"}`;
  try {
    const run = await (await fetch(base + "run.json")).json();
    clipOffset = run.clip_offset_s ?? 0;
    clipLoop = !!run.clip_loop;
    meta += ` · ${run.n_frames} frames @ ${run.fps} fps · rig ${run.rig.split("/").pop()} · ${run.elapsed_s}s on ${run.device}`;
  } catch {}
  $("rtag").textContent = textured
    ? "Output: m2mr clip on the textured hero rig (drag to orbit)"
    : "Output: mixamo_character.glb (drag to orbit)";
  $("meta").textContent = meta;
  await video.play().catch(() => {});
  $("play").textContent = video.paused ? "Play" : "Pause";
}

// ---- compare video toggle --------------------------------------------------
function showCompare(on) {
  const name = $("run").value;
  $("cmp").classList.toggle("on", on);
  $("main").classList.toggle("single", on);
  right.style.display = on ? "none" : "";
  const t = video.currentTime;
  video.src = `/runs/${encodeURIComponent(name)}/${on ? "compare.mp4" : "source.mp4"}`;
  video.currentTime = t;
  $("ltag").textContent = on
    ? "m2mr compare.mp4: source · Mixamo skeleton · human skeleton · character"
    : "Input: generated gesture video";
  if (!on) requestAnimationFrame(resize);
  if (!paused) video.play().catch(() => {});
}
$("cmp").onclick = () => showCompare(!$("cmp").classList.contains("on"));

// ---- transport -------------------------------------------------------------
$("play").onclick = () => {
  paused = !video.paused;
  if (paused) video.pause(); else video.play();
  $("play").textContent = paused ? "Play" : "Pause";
};
$("speed").onchange = () => (video.playbackRate = Number($("speed").value));
$("loop").onclick = () => $("loop").classList.toggle("on");
video.onended = () => {
  if ($("loop").classList.contains("on")) { video.currentTime = 0; video.play(); }
};
$("scrub").oninput = () => {
  video.currentTime = Number($("scrub").value) * (video.duration || 0);
};

// The video clock is the master: the GLB pose is sampled at the video's time.
function frame() {
  const t = video.currentTime || 0;
  if (mixer && action) {
    const ct = t - clipOffset;
    action.time = clipLoop ? ((ct % clipDur) + clipDur) % clipDur : Math.min(Math.max(ct, 0), clipDur);
    mixer.update(0);
  }
  if (video.duration) {
    if (document.activeElement !== $("scrub")) $("scrub").value = t / video.duration;
    $("time").textContent = `${t.toFixed(2)} / ${video.duration.toFixed(2)} s`;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
