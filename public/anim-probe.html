<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>anim probe</title>
<!--
  Scratch clip-identification page, NOT part of the app build. Loads a GLB,
  lists its animation groups, and can freeze any clip at a normalized time so
  a driver can screenshot contact sheets. Query params:
    ?file=/assets/work/pavlov/pavlov_animation.glb
-->
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<style>html,body{margin:0;height:100%;background:#181820}canvas{width:100%;height:100%;display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const params = new URLSearchParams(location.search);
const file = params.get("file") || "/assets/work/pavlov/pavlov_animation.glb";

const canvas = document.getElementById("c");
const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true });
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.09, 0.09, 0.13, 1);

const cam = new BABYLON.ArcRotateCamera("cam", -Math.PI / 2, Math.PI / 2.2, 4, new BABYLON.Vector3(0, 0.9, 0), scene);
cam.attachControl(canvas, true);
new BABYLON.HemisphericLight("h", new BABYLON.Vector3(0, 1, 0), scene).intensity = 1.1;
const dir = new BABYLON.DirectionalLight("d", new BABYLON.Vector3(-0.4, -1, 0.6), scene);
dir.intensity = 1.4;

window.__READY__ = false;
window.__GROUPS__ = [];

BABYLON.SceneLoader.ImportMeshAsync("", file.substring(0, file.lastIndexOf("/") + 1), file.substring(file.lastIndexOf("/") + 1), scene).then((res) => {
  scene.animationGroups.forEach((g) => g.stop());
  // Frame the model
  const root = res.meshes[0];
  const bounds = root.getHierarchyBoundingVectors(true);
  const size = bounds.max.subtract(bounds.min);
  const center = bounds.min.add(size.scale(0.5));
  cam.setTarget(center);
  cam.radius = Math.max(size.x, size.y, size.z) * 1.6;
  window.__GROUPS__ = scene.animationGroups.map((g) => ({ name: g.name, from: g.from, to: g.to }));
  window.__READY__ = true;
});

// Freeze a clip at fraction t in [0,1]. Returns clip info.
window.__POSE__ = (name, t) => {
  scene.animationGroups.forEach((g) => g.stop());
  const g = scene.animationGroups.find((x) => x.name === name);
  if (!g) return null;
  g.start(false, 1.0);
  const frame = g.from + (g.to - g.from) * t;
  g.goToFrame(frame);
  g.pause();
  return { name: g.name, from: g.from, to: g.to, frame };
};

window.__CAM__ = (alpha, beta, radiusScale) => {
  if (alpha != null) cam.alpha = alpha;
  if (beta != null) cam.beta = beta;
  if (radiusScale != null) cam.radius *= radiusScale;
};

// Compose a contact sheet: rows = camera angles, cols = normalized times.
// Renders each pose, copies the GL canvas into a 2D sheet canvas, and swaps
// the sheet into view so a driver can screenshot the whole page.
window.__SHEET__ = async (name, times, alphas) => {
  const sheet = document.createElement("canvas");
  sheet.width = canvas.width * times.length;
  sheet.height = canvas.height * alphas.length;
  const ctx = sheet.getContext("2d");
  for (let r = 0; r < alphas.length; r++) {
    cam.alpha = alphas[r];
    cam.beta = Math.PI / 2.15;
    for (let c = 0; c < times.length; c++) {
      window.__POSE__(name, Math.min(times[c], 0.999));
      scene.render();
      await new Promise((res) => setTimeout(res, 30));
      scene.render();
      ctx.drawImage(canvas, c * canvas.width, r * canvas.height);
    }
  }
  return sheet.toDataURL("image/png");
};

engine.runRenderLoop(() => scene.render());
</script>
</body>
</html>
